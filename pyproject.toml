[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "wall-street-journal-scraper"
version = "0.2.0"
description = "A typed, testable CLI for scraping Wall Street Journal headlines and DXY snapshots."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Isaac Cavallaro" }
]
dependencies = [
  "beautifulsoup4>=4.12.3,<5",
  "requests>=2.32.3,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5,<9",
  "pytest-cov>=5,<6"
]

[project.scripts]
wsj-scraper = "wsj_scraper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wsj_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
